apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://app:8000/metrics
    isDefault: true
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: llmeval
    secureJsonData:
      password: llmeval
    jsonData:
      database: llmevaldb
      sslmode: disable
      postgresVersion: 1800
