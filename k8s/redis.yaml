---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-eval-redis-pvc
  namespace: llm-eval
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-redis
  namespace: llm-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-eval-redis
  template:
    metadata:
      labels:
        app: llm-eval-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llm-eval-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-redis
  namespace: llm-eval
spec:
  selector:
    app: llm-eval-redis
  ports:
    - port: 6379
      targetPort: 6379
