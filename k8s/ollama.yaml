---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-eval-ollama-pvc
  namespace: llm-eval
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-ollama
  namespace: llm-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-eval-ollama
  template:
    metadata:
      labels:
        app: llm-eval-ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - |
              exec ollama serve
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-eval-ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-ollama
  namespace: llm-eval
spec:
  selector:
    app: llm-eval-ollama
  ports:
    - port: 11434
      targetPort: 11434
