---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-eval-grafana-pvc
  namespace: llm-eval
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-grafana
  namespace: llm-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-eval-grafana
  template:
    metadata:
      labels:
        app: llm-eval-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: llm-eval-secret
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-eval-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_INSTALL_PLUGINS
              value: grafana-piechart-panel
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: llm-eval-grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-grafana
  namespace: llm-eval
spec:
  selector:
    app: llm-eval-grafana
  ports:
    - port: 3000
      targetPort: 3000
