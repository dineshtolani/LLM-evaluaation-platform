---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-eval-dashboard
  namespace: llm-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-eval-dashboard
  template:
    metadata:
      labels:
        app: llm-eval-dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/dineshtolani/llm-eval-dashboard:latest
          ports:
            - containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://llm-eval-app:8000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-dashboard
  namespace: llm-eval
spec:
  selector:
    app: llm-eval-dashboard
  ports:
    - port: 8501
      targetPort: 8501
