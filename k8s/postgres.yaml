---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-eval-postgres-pvc
  namespace: llm-eval
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llm-eval-postgres
  namespace: llm-eval
spec:
  serviceName: llm-eval-postgres
  replicas: 1
  selector:
    matchLabels:
      app: llm-eval-postgres
  template:
    metadata:
      labels:
        app: llm-eval-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: llm-eval-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llm-eval-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: llm-eval-config
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - llmeval
                - -d
                - llmevaldb
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - llmeval
                - -d
                - llmevaldb
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-eval-postgres
  namespace: llm-eval
spec:
  selector:
    app: llm-eval-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
